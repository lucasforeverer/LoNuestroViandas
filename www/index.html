<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gastro · Gestión</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2a2420;--mu:#7a6f66;--bd:#e6ddd1;--ac:#c2410c;--ok:#15803d;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1613;--card:#26211d;--tx:#f1ebe4;--mu:#a39689;--bd:#3a332d;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1613;--card:#26211d;--tx:#f1ebe4;--mu:#a39689;--bd:#3a332d;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:960px;margin:0 auto;padding:0 12px 80px}
h1{font-size:20px;margin:14px 0 8px}h2{font-size:16px;margin:0 0 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:20px}.kpi span{color:var(--mu);font-size:12px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:2px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:end}
.btn{background:var(--ac);color:#fff;border:0;padding:10px 16px;border-radius:8px;font:inherit;cursor:pointer}
.btn.s{background:transparent;color:var(--mu);border:1px solid var(--bd);padding:4px 9px;font-size:13px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:480px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}th{font-size:12px;color:var(--mu);font-weight:600}
.low{color:var(--bad);font-weight:700}.ok{color:var(--ok)}.mu{color:var(--mu)}.r{text-align:right}
textarea{width:100%;min-height:120px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:12px monospace}
</style>
</head>
<body>
<h1>🍽️ Gastro · Gestión</h1>
<nav id="nav"></nav>
<main id="app"></main>
<script>
const K='gastro_v1';
let db=null;
try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
db=db||{productos:[],compras:[],ventas:[],abonos:[],pagos:{}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const M=n=>'$'+(+n||0).toLocaleString('es-AR',{maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const v=id=>document.getElementById(id).value;
const prod=id=>db.productos.find(p=>p.id===id);
let tab='resumen',mes=today().slice(0,7);
const TABS=[['resumen','Resumen'],['productos','Productos'],['compras','Compras'],['ventas','Ventas'],['abonos','Abonos'],['datos','Respaldo']];
const opts=()=>db.productos.map(p=>`<option value="${p.id}">${p.nombre}</option>`).join('');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('');
  document.getElementById('app').innerHTML=V[tab]();
}

const V={
resumen(){
  const inM=x=>x.fecha.slice(0,7)===mes;
  const ven=db.ventas.filter(inM).reduce((a,x)=>a+x.cant*x.precio,0);
  const cmp=db.compras.filter(inM).reduce((a,x)=>a+x.cant*x.costo,0);
  const cmv=db.ventas.filter(inM).reduce((a,x)=>a+x.cant*(x.costo||0),0);
  let ci=0,pg=0,pend=0;
  db.abonos.forEach(a=>{const ok=db.pagos[a.id+'|'+mes];if(a.tipo==='cobro'){ok?ci+=a.monto:pend+=a.monto}else{ok?pg+=a.monto:pend-=0}});
  const res=ven+ci-cmp-pg;
  const bajo=db.productos.filter(p=>p.stock<=p.minimo);
  const val=db.productos.reduce((a,p)=>a+p.stock*p.costo,0);
  return `<div class="card"><label>Mes</label><input type="month" id="mes" value="${mes}" data-mes></div>
  <div class="grid">
  <div class="kpi"><span>Ventas</span><b>${M(ven)}</b></div>
  <div class="kpi"><span>Compras</span><b>${M(cmp)}</b></div>
  <div class="kpi"><span>Ganancia bruta (ventas − costo)</span><b>${M(ven-cmv)}</b></div>
  <div class="kpi"><span>Abonos cobrados</span><b>${M(ci)}</b></div>
  <div class="kpi"><span>Abonos/gastos pagados</span><b>${M(pg)}</b></div>
  <div class="kpi"><span>Resultado de caja</span><b class="${res>=0?'ok':'low'}">${M(res)}</b></div>
  <div class="kpi"><span>Valor del stock</span><b>${M(val)}</b></div></div>
  <div class="card" style="margin-top:12px"><h2>⚠️ Stock bajo</h2>${bajo.length?bajo.map(p=>`<div>${esc(p.nombre)}: <span class="low">${p.stock} ${p.unidad}</span> <span class="mu">(mín. ${p.minimo})</span></div>`).join(''):'<span class="mu">Todo en orden.</span>'}</div>`;
},
productos(){
  return `<div class="card"><h2>Nuevo producto / insumo</h2><div class="f">
  <div><label>Nombre</label><input id="n"></div>
  <div><label>Categoría</label><input id="c" placeholder="Bebidas, Carnes…"></div>
  <div><label>Unidad</label><select id="u"><option>un</option><option>kg</option><option>lt</option><option>porción</option></select></div>
  <div><label>Costo</label><input id="co" type="number" step="any"></div>
  <div><label>Precio venta</label><input id="pr" type="number" step="any"></div>
  <div><label>Stock inicial</label><input id="st" type="number" step="any" value="0"></div>
  <div><label>Stock mínimo</label><input id="mi" type="number" step="any" value="0"></div>
  <button class="btn" data-act="addProd">Guardar</button></div></div>
  <div class="card tw"><table><tr><th>Producto</th><th>Cat.</th><th class="r">Costo</th><th class="r">Precio</th><th class="r">Stock</th><th></th></tr>
  ${db.productos.map(p=>`<tr><td>${esc(p.nombre)}</td><td class="mu">${esc(p.cat)}</td><td class="r">${M(p.costo)}</td><td class="r">${M(p.precio)}</td><td class="r ${p.stock<=p.minimo?'low':''}">${p.stock} ${p.unidad}</td><td><button class="btn s" data-act="editProd" data-id="${p.id}">Editar</button> <button class="btn s" data-act="delProd" data-id="${p.id}">✕</button></td></tr>`).join('')||'<tr><td class="mu">Sin productos todavía.</td></tr>'}</table></div>`;
},
compras(){
  return `<div class="card"><h2>Registrar compra (suma stock)</h2><div class="f">
  <div><label>Fecha</label><input id="d" type="date" value="${today()}"></div>
  <div><label>Proveedor</label><input id="pv"></div>
  <div><label>Producto</label><select id="p">${opts()}</select></div>
  <div><label>Cantidad</label><input id="q" type="number" step="any"></div>
  <div><label>Costo unitario</label><input id="co" type="number" step="any"></div>
  <button class="btn" data-act="addCompra">Registrar</button></div></div>
  <div class="card tw"><table><tr><th>Fecha</th><th>Proveedor</th><th>Producto</th><th class="r">Cant.</th><th class="r">Total</th><th></th></tr>
  ${[...db.compras].reverse().map(c=>`<tr><td>${c.fecha}</td><td>${esc(c.prov)}</td><td>${esc(c.nombre)}</td><td class="r">${c.cant}</td><td class="r">${M(c.cant*c.costo)}</td><td><button class="btn s" data-act="delCompra" data-id="${c.id}">✕</button></td></tr>`).join('')||'<tr><td class="mu">Sin compras.</td></tr>'}</table></div>`;
},
ventas(){
  return `<div class="card"><h2>Registrar venta (descuenta stock)</h2><div class="f">
  <div><label>Fecha</label><input id="d" type="date" value="${today()}"></div>
  <div><label>Producto</label><select id="p">${opts()}</select></div>
  <div><label>Cantidad</label><input id="q" type="number" step="any" value="1"></div>
  <div><label>Precio unitario (vacío = lista)</label><input id="pr" type="number" step="any"></div>
  <div><label>Medio de pago</label><select id="mp"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>QR</option></select></div>
  <button class="btn" data-act="addVenta">Vender</button></div></div>
  <div class="card tw"><table><tr><th>Fecha</th><th>Producto</th><th class="r">Cant.</th><th class="r">Total</th><th>Pago</th><th></th></tr>
  ${[...db.ventas].reverse().map(c=>`<tr><td>${c.fecha}</td><td>${esc(c.nombre)}</td><td class="r">${c.cant}</td><td class="r">${M(c.cant*c.precio)}</td><td class="mu">${c.mp}</td><td><button class="btn s" data-act="delVenta" data-id="${c.id}">✕</button></td></tr>`).join('')||'<tr><td class="mu">Sin ventas.</td></tr>'}</table></div>`;
},
abonos(){
  return `<div class="card"><h2>Nuevo abono mensual</h2><div class="f">
  <div><label>Concepto / cliente</label><input id="n" placeholder="Alquiler, Luz, Cliente X…"></div>
  <div><label>Tipo</label><select id="t"><option value="gasto">Gasto fijo (pago)</option><option value="cobro">Abono de cliente (cobro)</option></select></div>
  <div><label>Monto mensual</label><input id="m" type="number" step="any"></div>
  <div><label>Día de vencimiento</label><input id="di" type="number" min="1" max="31" value="10"></div>
  <button class="btn" data-act="addAbono">Guardar</button></div></div>
  <div class="card tw"><div style="margin-bottom:8px"><label>Mes</label><input type="month" value="${mes}" data-mes style="max-width:180px"></div>
  <table><tr><th>Concepto</th><th>Tipo</th><th class="r">Monto</th><th>Vence</th><th>Estado</th><th></th></tr>
  ${db.abonos.map(a=>{const ok=db.pagos[a.id+'|'+mes];return `<tr><td>${esc(a.nombre)}</td><td class="mu">${a.tipo==='cobro'?'Cobro':'Pago'}</td><td class="r">${M(a.monto)}</td><td>día ${a.dia}</td><td><button class="btn s" data-act="togPago" data-id="${a.id}">${ok?'✅ '+(a.tipo==='cobro'?'Cobrado':'Pagado'):'⏳ Pendiente'}</button></td><td><button class="btn s" data-act="delAbono" data-id="${a.id}">✕</button></td></tr>`}).join('')||'<tr><td class="mu">Sin abonos.</td></tr>'}</table></div>`;
},
datos(){
  return `<div class="card"><h2>Respaldo</h2><p class="mu">Los datos se guardan en este dispositivo. Copiá este texto y guardalo (mail, notas) para pasarlo a otro equipo.</p>
  <textarea id="exp" readonly>${esc(JSON.stringify(db))}</textarea>
  <p><button class="btn" data-act="copy">Copiar respaldo</button></p></div>
  <div class="card"><h2>Restaurar</h2><textarea id="imp" placeholder="Pegá acá un respaldo…"></textarea>
  <p><button class="btn" data-act="import">Restaurar (reemplaza todo)</button> <button class="btn s" data-act="reset">Borrar todo</button></p></div>`;
}};

const A={
addProd(){const n=v('n').trim();if(!n)return;db.productos.push({id:uid(),nombre:n,cat:v('c'),unidad:v('u'),costo:+v('co')||0,precio:+v('pr')||0,stock:+v('st')||0,minimo:+v('mi')||0})},
editProd(id){const p=prod(id);const pr=prompt('Precio de venta',p.precio);if(pr===null)return;const st=prompt('Stock actual',p.stock);if(st===null)return;p.precio=+pr||0;p.stock=+st||0},
delProd(id){if(confirm('¿Borrar producto?'))db.productos=db.productos.filter(p=>p.id!==id)},
addCompra(){const p=prod(v('p'));const q=+v('q');if(!p||!q)return;const co=+v('co')||p.costo;db.compras.push({id:uid(),fecha:v('d'),prov:v('pv'),pid:p.id,nombre:p.nombre,cant:q,costo:co});p.stock+=q;p.costo=co},
delCompra(id){const c=db.compras.find(x=>x.id===id);const p=prod(c.pid);if(p)p.stock-=c.cant;db.compras=db.compras.filter(x=>x.id!==id)},
addVenta(){const p=prod(v('p'));const q=+v('q');if(!p||!q)return;if(q>p.stock&&!confirm('Stock insuficiente ('+p.stock+'). ¿Vender igual?'))return;db.ventas.push({id:uid(),fecha:v('d'),pid:p.id,nombre:p.nombre,cant:q,precio:+v('pr')||p.precio,costo:p.costo,mp:v('mp')});p.stock-=q},
delVenta(id){const c=db.ventas.find(x=>x.id===id);const p=prod(c.pid);if(p)p.stock+=c.cant;db.ventas=db.ventas.filter(x=>x.id!==id)},
addAbono(){const n=v('n').trim();if(!n)return;db.abonos.push({id:uid(),nombre:n,tipo:v('t'),monto:+v('m')||0,dia:+v('di')||1})},
togPago(id){const k=id+'|'+mes;if(db.pagos[k])delete db.pagos[k];else db.pagos[k]=today()},
delAbono(id){if(confirm('¿Borrar abono?'))db.abonos=db.abonos.filter(a=>a.id!==id)},
copy(){const t=document.getElementById('exp');t.select();try{document.execCommand('copy');alert('Copiado')}catch(e){}return 1},
import(){try{const d=JSON.parse(v('imp'));if(!d.productos)throw 0;if(!confirm('Esto reemplaza los datos actuales.'))return;db=d}catch(e){alert('Respaldo inválido');return 1}},
reset(){if(confirm('¿Borrar TODOS los datos?'))db={productos:[],compras:[],ventas:[],abonos:[],pagos:{}}}
};

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();return}
  const f=A[b.dataset.act];if(!f)return;
  if(f(b.dataset.id)===1)return;
  save();render();
});
document.addEventListener('change',e=>{if(e.target.dataset.mes!==undefined){mes=e.target.value||mes;render()}});
render();
</script>
</body>
</html>
